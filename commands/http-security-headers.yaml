id: http-security-headers
name: HTTP security headers
schema_version: 1
description: Fetch a page and list which common security headers are missing (HSTS, CSP, X-Content-Type-Options, X-Frame-Options, Referrer-Policy, Permissions-Policy)
tags: [web, hardening, http]
tool: curl
args:
  - name: url
    type: string
    description: Page to fetch (redirects are followed)
    required: true
    example: https://app.example.com/
    regex: '^https?://[^\s]+$'
command: |
  curl -sS -k -L -o /dev/null -D /work/headers.txt {{ url }} || exit 1
  grep -i '^HTTP/' /work/headers.txt | tail -1
  for h in Strict-Transport-Security Content-Security-Policy X-Content-Type-Options X-Frame-Options Referrer-Policy Permissions-Policy; do
    if grep -qi "^$h:" /work/headers.txt; then echo "present: $(grep -i "^$h:" /work/headers.txt | tail -1 | tr -d '\r')"; else echo "missing: $h"; fi
  done
outputs:
  - name: missing
    type: list<string>
    parser: regex
    options:
      pattern: '^missing: (.+)$'
      group: 1
