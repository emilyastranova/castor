id: nmap-port-445
name: Nmap SMB port 445 scan
schema_version: 1
description: Scan for open port 445 (SMB) across target hosts or subnets
tags: [network, smb, nmap]
tool: nmap
container_flags:
  - --privileged
  - --network=bridge
args:
  - name: targets
    type: list
    description: Target IP, range, or comma-separated list
    required: true
    example: 192.168.1.0/24
    regex: '^[0-9a-zA-Z./,:_ -]+$'
  - name: ports
    type: string
    description: Ports to scan
    required: false
    default: "445"
  - name: exclude
    type: list
    separator: ","
    description: Hosts or ranges to skip (pick an exclusion list)
    regex: '^[0-9a-zA-Z./:_-]+$'
    flag: --exclude
command: nmap -p {{ ports }} --open -oX /work/nmap-445.xml {{ targets }} {{ exclude }}
outputs:
  - name: hosts
    type: list<host>
    parser: nmap.hosts
    source: /work/nmap-445.xml
