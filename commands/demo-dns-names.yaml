# Demo command for the pipeline-demo playbook: fakes reverse DNS lookups without touching the
# network. Runs on the host shell (agent --allow-host) or any image with /bin/sh and awk.
id: demo-dns-names
name: "Demo: DNS names"
schema_version: 1
description: "Pretend reverse lookups: one name per host, plus a www alias for even octets"
tags: [demo]
args:
  - name: targets
    type: string
    description: Comma-separated IPs
    required: true
    example: 10.20.0.10,10.20.0.11
  - name: step
    type: string
    description: Playbook step id, compared with fail_at and empty_at
    default: demo
  - name: delay
    type: number
    description: Seconds to pretend to work (multiplied by speed)
    default: 2
  - name: speed
    type: number
    description: Multiplier for delay; 0 finishes instantly
    default: 1
  - name: fail_at
    type: string
    description: Exit 1 when this equals step
    default: none
  - name: empty_at
    type: string
    description: Produce no results when this equals step
    default: none
command: |
  step={{ step }}
  secs=$(awk -v d={{ delay }} -v s={{ speed }} 'BEGIN { print d * s }')
  echo "[demo] $step: working for ${secs}s"
  sleep "$secs"
  if [ {{ fail_at }} = "$step" ]; then echo "[demo] $step: failing on purpose (fail_at)" >&2; exit 1; fi
  empty=0; if [ {{ empty_at }} = "$step" ]; then empty=1; echo "[demo] $step: producing no results (empty_at)"; fi
  octet() { n=${1##*.}; case $n in ''|*[!0-9]*) n=0;; esac; echo "$n"; }
  targets={{ targets }}
  : > names.txt
  if [ "$empty" = 0 ]; then
    for ip in $(echo "$targets" | tr ',' ' '); do
      n=$(octet "$ip")
      echo "host-$n.lab.internal" >> names.txt
      if [ $((n % 2)) = 0 ]; then echo "www$n.lab.internal" >> names.txt; fi
    done
  fi
  echo "[demo] $step: wrote names.txt"
outputs:
  - name: names
    type: list<string>
    parser: lines
    source: /work/names.txt
