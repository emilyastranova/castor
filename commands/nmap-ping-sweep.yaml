id: nmap-ping-sweep
name: Nmap ping sweep
schema_version: 1
description: Discover live hosts in a network range
tags: [network, discovery, nmap]
image: docker.io/instrumentisto/nmap
container_flags:
  - --privileged
  - --network=bridge
args:
  - name: targets
    type: list
    description: CIDR range, host, or comma-separated list
    required: true
    example: 192.168.0.0/24
    regex: '^[0-9a-zA-Z./,:_ -]+$'
  - name: exclude
    type: list
    separator: ","
    description: Hosts or ranges to skip (pick an exclusion list)
    regex: '^[0-9a-zA-Z./:_-]+$'
    flag: --exclude
command: nmap -sn -oX /work/ping-sweep.xml {{ targets }} {{ exclude }}
outputs:
  - name: hosts
    type: list<host>
    parser: nmap.hosts
    source: /work/ping-sweep.xml
