id: github-issues
name: GitHub issues
schema_version: 1
kind: http
description: List a repository's issues and pull requests, every page of them
tags: [github, http]
args:
  - name: owner
    type: string
    required: true
    example: emilyastranova
    regex: '^[A-Za-z0-9][A-Za-z0-9-]{0,38}$'
  - name: repo
    type: string
    required: true
    example: castor
    regex: '^[A-Za-z0-9._-]{1,100}$'
  - name: state
    type: string
    choices: [open, closed, all]
    default: open
  - name: labels
    type: list
    description: Only issues with all of these labels
    separator: ","
vars:
  - name: github
    kind: api-token
    description: A token that can read the repository; Base URL https://api.github.com (or your Enterprise server's /api/v3)
request:
  url: "{{ github.base_url }}/repos/{{ owner }}/{{ repo }}/issues"
  query:
    state: "{{ state }}"
    labels: "{{ labels }}"
  headers:
    Accept: application/vnd.github+json
    X-GitHub-Api-Version: "2022-11-28"
  auth:
    bearer: "{{ github.token }}"
paginate:
  style: link
  size_param: per_page
  size: 100
  stop: {max_pages: 20}
outputs:
  - name: issues
    parser: json-records
rate_limit: 5000/hour
