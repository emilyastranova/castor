# Demo command for the pipeline-demo playbook: fakes a ping sweep without touching the
# network. Runs on the host shell (agent --allow-host) or any image with /bin/sh and awk.
id: demo-seed-hosts
name: "Demo: seed hosts"
schema_version: 1
description: "Pretend ping sweep: emits nmap XML for a run of hosts in a /24"
tags: [demo]
args:
  - name: subnet
    type: string
    description: First three octets of the fake network
    default: 10.20.0
    regex: '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$'
  - name: count
    type: number
    description: How many live hosts to invent (from .10 upwards)
    default: 6
  - name: step
    type: string
    description: Playbook step id, compared with fail_at and empty_at
    default: demo
  - name: delay
    type: number
    description: Seconds to pretend to work (multiplied by speed)
    default: 2
  - name: speed
    type: number
    description: Multiplier for delay; 0 finishes instantly
    default: 1
  - name: fail_at
    type: string
    description: Exit 1 when this equals step
    default: none
  - name: empty_at
    type: string
    description: Produce no results when this equals step
    default: none
command: |
  step={{ step }}
  secs=$(awk -v d={{ delay }} -v s={{ speed }} 'BEGIN { print d * s }')
  echo "[demo] $step: working for ${secs}s"
  sleep "$secs"
  if [ {{ fail_at }} = "$step" ]; then echo "[demo] $step: failing on purpose (fail_at)" >&2; exit 1; fi
  empty=0; if [ {{ empty_at }} = "$step" ]; then empty=1; echo "[demo] $step: producing no results (empty_at)"; fi
  octet() { n=${1##*.}; case $n in ''|*[!0-9]*) n=0;; esac; echo "$n"; }
  subnet={{ subnet }}; count={{ count }}
  {
    echo '<?xml version="1.0"?>'
    echo '<nmaprun scanner="nmap" args="nmap -sn (castor demo)">'
    if [ "$empty" = 0 ]; then
      i=0
      while [ "$i" -lt "$count" ]; do
        n=$((10 + i))
        echo "<host><status state=\"up\"/><address addr=\"$subnet.$n\" addrtype=\"ipv4\"/><hostnames><hostname name=\"host-$n.lab.internal\"/></hostnames></host>"
        i=$((i + 1))
      done
      echo "<host><status state=\"down\"/><address addr=\"$subnet.250\" addrtype=\"ipv4\"/></host>"
    fi
    echo '<runstats><finished exit="success"/></runstats></nmaprun>'
  } > hosts.xml
  echo "[demo] $step: wrote hosts.xml"
outputs:
  - name: hosts
    type: list<host>
    parser: nmap.hosts
    source: /work/hosts.xml
    options:
      include_down: false
