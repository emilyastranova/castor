id: nmap-service-scan
name: Nmap service scan
schema_version: 1
description: Version-detect open TCP ports on the given hosts
tags: [network, service, nmap]
image: docker.io/instrumentisto/nmap
container_flags:
  - --privileged
  - --network=bridge
args:
  - name: targets
    type: list
    description: Hosts to scan (output of a ping sweep works here)
    required: true
    example: 192.168.0.10,192.168.0.11
  - name: ports
    type: string
    description: Port spec for -p
    required: false
    default: "1-1000"
  - name: exclude
    type: list
    separator: ","
    description: Hosts or ranges to skip (pick an exclusion list)
    regex: '^[0-9a-zA-Z./:_-]+$'
    flag: --exclude
command: nmap -sV -p {{ ports }} -oX /work/service-scan.xml {{ targets }} {{ exclude }}
outputs:
  - name: services
    type: list<service>
    parser: nmap.services
    source: /work/service-scan.xml
