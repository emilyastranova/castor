id: netexec-shares
name: NetExec SMB shares
schema_version: 1
description: List the SMB shares each host offers and what the account can do on them (READ / WRITE)
tool: netexec
tags: [network, smb, netexec, credentials]
args:
  - name: targets
    type: string
    description: Target host(s), IPs, CIDR, or comma-separated list
    required: true
    example: 192.168.1.10
vars:
  - name: creds
    kind: credential
    description: Account to authenticate with (password or NT hash; domain optional; empty for a null session)
# Same authentication as netexec-smb-auth: NT hash when the set has one, else the password.
command: |
  echo {{ targets }} | tr ", " "\n\n" | sed "/^$/d" > targets.txt
  if [ -n "$CASTOR_VAR_CREDS_NT_HASH" ]; then set -- -H {{ creds.nt_hash }}; else set -- -p {{ creds.password }}; fi
  nxc smb targets.txt -u {{ creds.username }} "$@" ${CASTOR_VAR_CREDS_DOMAIN:+-d "$CASTOR_VAR_CREDS_DOMAIN"} --shares > nxc.txt
  status=$?
  cat nxc.txt
  # "host share permissions" for every share the account can read or write.
  awk '$1=="SMB" {for (i=6; i<=NF; i++) if ($i ~ /^(READ|WRITE)(,(READ|WRITE))?$/) {print $2, $5, $i; break}}' nxc.txt > {{work}}/shares.txt
  exit $status
outputs:
  - name: accessible
    type: list<string>
    parser: lines
    source: "{{work}}/shares.txt"
  - name: smb_hosts
    type: list<smb_host>
    parser: netexec.smb
