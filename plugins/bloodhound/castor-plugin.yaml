# Bring a SharpHound collection in, and see who can get to Domain Admins. The format is docs/PLUGINS.md.
id: bloodhound
name: BloodHound bridge
version: 1.0.0
castor: ">=0.1"
publisher: castor
description: "Import a SharpHound collection (BloodHound CE): users, computers and domains as assets, sessions, admin rights and trusts as relationships, and everyone's shortest path to Domain Admins."
homepage: https://github.com/emilyastranova/castor/tree/main/plugins/bloodhound
license: MIT
main: main.ts
icon: icon.svg
runtime: sandboxed
# As its own account: read the projects it's enabled in, record assets.
permissions:
  - projects:read
  - assets:write
actions:
  - id: import
    label: Import SharpHound data
    description: A SharpHound .zip, or one of its users, computers, groups or domains .json files (BloodHound CE format). Imports add to what's there.
    icon: hub
    on: [project]
    file:
      accept: [".zip", ".json"]
      max_mb: 300
    timeout_minutes: 30
  - id: forget
    label: Forget the BloodHound graph
    description: Drop the imported graph the paths come from (the assets and relationships stay).
    icon: delete_sweep
    on: [project]
ui:
  - id: paths
    slot: project.page
    title: Attack paths
    path: ui/paths.html
    icon: route
  - id: asset-path
    slot: asset.panel
    title: Path to Domain Admins
    path: ui/paths.html
    icon: route
    asset_types: [user, host]
    height: 140
