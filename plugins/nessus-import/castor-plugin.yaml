# Castor's first plugin, and the example to copy: the format is docs/PLUGINS.md.
id: nessus-import
name: Nessus import
version: 1.0.0
castor: ">=0.1"
publisher: castor
description: "Bring a .nessus scan into a project's assets: hosts, services and vulnerabilities, each linked to what it affects."
homepage: https://github.com/emilyastranova/castor/tree/main/plugins/nessus-import
license: MIT
main: main.ts
icon: icon.svg
runtime: sandboxed
# What it does in Castor, as its own account: read the projects it's enabled in, record assets.
permissions:
  - projects:read
  - assets:write
actions:
  - id: import
    label: Import .nessus file
    description: Hosts, services and vulnerabilities from a Nessus or Tenable scan export (.nessus, v2).
    icon: upload_file
    on: [project, card]
    file:
      accept: [".nessus", ".xml"]
      max_mb: 500
    timeout_minutes: 60
settings:
  - name: info_findings
    label: Record informational findings
    description: Nessus reports hundreds of these per host (service detection, banners…); off, only low and above become vulnerabilities.
    type: bool
    default: false
