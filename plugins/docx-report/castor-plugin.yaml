# A project's findings, hosts and notes as a Word document. The format is docs/PLUGINS.md.
id: docx-report
name: DOCX report
version: 1.0.0
castor: ">=0.1"
publisher: castor
description: "Write a project's findings, hosts and pinned notes as a Word document (.docx), attached to a card."
homepage: https://github.com/emilyastranova/castor/tree/main/plugins/docx-report
license: MIT
main: main.ts
icon: icon.svg
runtime: sandboxed
# As its own account: read the project and its assets, add a card and attach the document.
permissions:
  - projects:read
  - projects:write
  - assets:read
actions:
  - id: write
    label: Write DOCX report
    description: Findings by severity with what they affect, the hosts and their services, and the pinned notes. On a card, it's attached there; otherwise to a new card.
    icon: description
    on: [project, card]
    timeout_minutes: 10
settings:
  - name: title
    label: Report title
    type: text
    default: Security assessment report
  - name: author
    label: Author
    description: Who the report says prepared it. Empty, the person who writes it.
    type: text
    default: ""
  - name: min_severity
    label: Lowest severity included
    type: select
    options: [critical, high, medium, low, info]
    default: low
  - name: include_hosts
    label: List the hosts
    type: bool
    default: true
  - name: include_notes
    label: Include the pinned notes
    type: bool
    default: true
    per_user: never
