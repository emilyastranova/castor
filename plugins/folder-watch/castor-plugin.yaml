# The example of an unrestricted plugin: it reads a folder on the Castor server, which a sandboxed
# plugin can't. The format is docs/PLUGINS.md.
id: folder-watch
name: Watch folder
version: 1.0.0
castor: ">=0.1"
publisher: castor
description: "Files dropped in a folder on the Castor server go to their project: each becomes a card with the file attached, and a plugin that imports that kind of file (Nessus, SharpHound…) runs on it."
homepage: https://github.com/emilyastranova/castor/tree/main/plugins/folder-watch
license: MIT
main: main.ts
icon: icon.svg
# Unrestricted: it reads and moves files on this server. Castor can't limit what it does.
runtime: unrestricted
permissions:
  - projects:read
  - projects:write
settings:
  - name: folder
    label: Folder
    description: "On the Castor server (in Docker, a path in the server container, such as one under the /data volume). It gets a folder per project, named by its code name: drop files there."
    type: text
    default: /data/inbox
    required: true
    per_user: never
  - name: every
    label: Look every (seconds)
    type: number
    default: 30
    per_user: never
  - name: run_imports
    label: Run import actions
    description: Hand each file to a plugin action that takes its kind of file, on its card.
    type: bool
    default: true
    per_user: never
