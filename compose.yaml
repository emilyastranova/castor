# Castor from the published images on Docker Hub. This file and a .env are all it needs:
#   curl -fsSLO https://github.com/emilyastranova/castor/releases/latest/download/compose.yaml
#   curl -fsSL https://github.com/emilyastranova/castor/releases/latest/download/env.example -o .env
#   # edit the secrets in .env, then:
#   docker compose up -d
# UI: http://localhost:8080 (API docs at /api/docs). Add `--profile agent` for an agent in the stack.
# CASTOR_VERSION in .env picks the images: latest (default), a release such as 1.0.0, or edge (main).
# Works with `docker compose` and `podman compose`. To build from a checkout instead, see compose.dev.yaml.
name: castor

services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: castor
      POSTGRES_USER: castor
      POSTGRES_PASSWORD: ${CASTOR_DB_PASSWORD:-castor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U castor -d castor"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The API, with the built-in library of commands, tools, playbooks and themes inside the image.
  server:
    image: docker.io/emilyastranova/castor:${CASTOR_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CASTOR_DATABASE_URL: postgresql+asyncpg://castor:${CASTOR_DB_PASSWORD:-castor}@db:5432/castor
      CASTOR_SECRET_KEY: ${CASTOR_SECRET_KEY:?set CASTOR_SECRET_KEY in .env}
      CASTOR_AGENT_SECRET: ${CASTOR_AGENT_SECRET:?set CASTOR_AGENT_SECRET in .env}
      CASTOR_ADMIN_USERNAME: ${CASTOR_ADMIN_USERNAME:-admin}
      CASTOR_ADMIN_PASSWORD: ${CASTOR_ADMIN_PASSWORD:-castor}
      CASTOR_CORS_ORIGINS: '["${CASTOR_PUBLIC_URL:-http://localhost:8080}"]'
      CASTOR_DATA_DIR: /data
      CASTOR_ALLOW_SHARED_AGENT_SECRET: ${CASTOR_ALLOW_SHARED_AGENT_SECRET:-true}
      CASTOR_VAULT_KEY: ${CASTOR_VAULT_KEY:-}
      CASTOR_NOTIFY_WEBHOOKS: ${CASTOR_NOTIFY_WEBHOOKS:-}
      CASTOR_PUBLIC_URL: ${CASTOR_PUBLIC_URL:-http://localhost:8080}
      CASTOR_PLUGINS_RESTRICTED: ${CASTOR_PLUGINS_RESTRICTED:-false}
      CASTOR_PLUGINS_SAFE_MODE: ${CASTOR_PLUGINS_SAFE_MODE:-false}
      CASTOR_PLUGIN_DIRECTORY_URL: ${CASTOR_PLUGIN_DIRECTORY_URL-https://raw.githubusercontent.com/emilyastranova/castor-plugins/main/directory.json}
      CASTOR_GITHUB_API_URL: ${CASTOR_GITHUB_API_URL:-https://api.github.com}
      CASTOR_GITHUB_TOKEN: ${CASTOR_GITHUB_TOKEN:-}
    volumes:
      - serverdata:/data

  web:
    image: docker.io/emilyastranova/castor-web:${CASTOR_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - server
    environment:
      API_INTERNAL_URL: http://server:8000
      PORT: "3000"

  # One address for everything: /api and /ws to the server, the rest to the web UI. Its
  # Caddyfile is written from CADDYFILE at start, so this compose file needs no other files.
  proxy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - server
    ports:
      - "${CASTOR_HTTP_PORT:-8080}:80"
    environment:
      CADDYFILE: |
        :80 {
            encode gzip
            @api path /api/* /ws/*
            handle @api {
                reverse_proxy server:8000
            }
            handle {
                reverse_proxy web:3000
            }
        }
    entrypoint: ["/bin/sh", "-c", "printf '%s\\n' \"$$CADDYFILE\" > /etc/caddy/Caddyfile && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]

  # A sample agent running inside the stack. It runs jobs in sibling containers through
  # the host's container socket. Production workflows usually run agents on dedicated boxes:
  #   castor-agent --server wss://<castor-host>/ws/agent --token <token from Agents → Enroll agent>
  agent:
    image: docker.io/emilyastranova/castor-agent:${CASTOR_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - server
    profiles: ["agent"]
    environment:
      CASTOR_SERVER_URL: ws://server:8000/ws/agent
      # Its own token (Agents → Enroll agent) is used when set; otherwise the shared secret.
      CASTOR_AGENT_TOKEN: ${CASTOR_AGENT_TOKEN:-}
      CASTOR_AGENT_SECRET: ${CASTOR_AGENT_SECRET}
      CASTOR_AGENT_NAME: ${CASTOR_AGENT_NAME:-compose-agent}
      CASTOR_AGENT_TAGS: ${CASTOR_AGENT_TAGS:-lab}
      CASTOR_AGENT_RUNTIME: ${CASTOR_AGENT_RUNTIME:-auto}
      CASTOR_AGENT_WORKDIR: /work
      CONTAINER_HOST: unix:///run/podman/podman.sock
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /work:/work
      # Mount whichever socket your host has. Comment out the other.
      - ${CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock

volumes:
  pgdata:
  serverdata:
