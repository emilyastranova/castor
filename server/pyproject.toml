[project]
name = "castor-server"
version = "0.1.0"
description = "Castor API server and job orchestrator"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "starlette>=0.49.1",  # floor past known advisories (multipart DoS fixed in 0.47.2, Range header ReDoS in 0.49.1)
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "pyyaml>=6.0",
  "aiofiles>=23.2",
  "defusedxml>=0.7",
  "regex>=2024.4",
  "cryptography>=42",
  "httpx>=0.27",
  "asyncssh[bcrypt]>=2.14",  # SSH hosts; bcrypt reads passphrase-protected keys (orchestrator/ssh.py)
  "mini-racer>=0.14",  # JavaScript parsers, in a V8 isolate (js_sandbox.py)
  "weasyprint>=62",  # timeline exports as PDF (report.py); needs Pango, see the Dockerfile
  "markdown-it-py>=3",  # markdown in exports
  "nh3>=0.2",  # sanitising that markdown
  "tzdata",  # time zones where the system has none (the slim image)
  "deno>=2.9,<3",  # runs plugins, each in its own sandboxed process (plugin_runtime.py)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
castor-server = "castor_server.__main__:main"
castor-admin = "castor_server.manage:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["castor_server*"]

[tool.setuptools.package-data]
castor_server = ["migrations/script.py.mako", "parser_samples/*", "plugin_sdk/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
