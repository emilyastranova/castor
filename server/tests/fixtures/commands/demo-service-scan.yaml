# Demo command for the pipeline-demo playbook: fakes an nmap service scan without touching the
# network. Runs on the host shell (agent --allow-host) or any image with /bin/sh and awk.
id: demo-service-scan
name: "Demo: service scan"
schema_version: 1
description: "Pretend service scan: every host has ssh; web ports depend on the last octet"
tags: [demo]
args:
  - name: targets
    type: string
    description: Comma-separated IPs
    required: true
    example: 10.20.0.10,10.20.0.12
  - name: step
    type: string
    description: Playbook step id, compared with fail_at and empty_at
    default: demo
  - name: delay
    type: number
    description: Seconds to pretend to work (multiplied by speed)
    default: 2
  - name: speed
    type: number
    description: Multiplier for delay; 0 finishes instantly
    default: 1
  - name: fail_at
    type: string
    description: Exit 1 when this equals step
    default: none
  - name: empty_at
    type: string
    description: Produce no results when this equals step
    default: none
command: |
  step={{ step }}
  secs=$(awk -v d={{ delay }} -v s={{ speed }} 'BEGIN { print d * s }')
  echo "[demo] $step: working for ${secs}s"
  sleep "$secs"
  if [ {{ fail_at }} = "$step" ]; then echo "[demo] $step: failing on purpose (fail_at)" >&2; exit 1; fi
  empty=0; if [ {{ empty_at }} = "$step" ]; then empty=1; echo "[demo] $step: producing no results (empty_at)"; fi
  octet() { n=${1##*.}; case $n in ''|*[!0-9]*) n=0;; esac; echo "$n"; }
  targets={{ targets }}
  port() { echo "<port protocol=\"tcp\" portid=\"$1\"><state state=\"$2\"/><service name=\"$3\" product=\"$4\" version=\"$5\"/></port>"; }
  {
    echo '<?xml version="1.0"?><nmaprun scanner="nmap" args="nmap -sV (castor demo)">'
    if [ "$empty" = 0 ]; then
      for ip in $(echo "$targets" | tr ',' ' '); do
        n=$(octet "$ip")
        echo "<host><status state=\"up\"/><address addr=\"$ip\" addrtype=\"ipv4\"/><ports>"
        port 22 open ssh OpenSSH 9.6
        if [ $((n % 2)) = 0 ]; then port 80 open http nginx 1.27; fi
        if [ $((n % 3)) = 0 ]; then port 443 open https nginx 1.27; fi
        if [ $((n % 4)) = 1 ]; then port 8080 open http-proxy Tomcat 10.1; fi
        if [ $((n % 5)) = 0 ]; then port 3306 closed mysql MySQL 8.0; fi
        echo "</ports></host>"
      done
    fi
    echo '<runstats><finished exit="success"/></runstats></nmaprun>'
  } > services.xml
  echo "[demo] $step: wrote services.xml"
outputs:
  - name: services
    type: list<service>
    parser: nmap.services
    source: /work/services.xml
