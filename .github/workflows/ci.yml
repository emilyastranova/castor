# Tests on every push and pull request. When they pass:
# - a push to main publishes `edge` images to Docker Hub;
# - a version tag (vX.Y.Z, made by scripts/release.sh) publishes X.Y.Z, X.Y and latest images
#   and creates a GitHub Release with notes from the merged changes.
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access
# token with Read & Write).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: docker.io/emilyastranova/castor  # the server is castor; the others castor-web, castor-agent

jobs:
  version:
    name: Version matches the tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check server, agent and web versions
        run: |
          want="${GITHUB_REF_NAME#v}"
          bad=0
          for f in server/pyproject.toml agent/pyproject.toml; do
            have=$(sed -n 's/^version = "\(.*\)"/\1/p' "$f" | head -1)
            [ "$have" = "$want" ] || { echo "::error file=$f::version is $have, the tag says $want (use scripts/release.sh)"; bad=1; }
          done
          have=$(node -p "require('./web/package.json').version")
          [ "$have" = "$want" ] || { echo "::error file=web/package.json::version is $have, the tag says $want (use scripts/release.sh)"; bad=1; }
          exit $bad

  server:
    name: Server and agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/pyproject.toml
            agent/pyproject.toml
      - name: Pango for WeasyPrint (PDF exports)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -e "./server[dev]" -e "./agent[dev]"
      - run: ruff check server/castor_server agent/castor_agent
      - run: python -m pytest server/tests -q
      - run: python -m pytest agent/tests -q

  web:
    name: Web check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build

  images:
    name: Image ${{ matrix.image }}
    needs: [server, web]
    # Main and version tags only.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            context: .
            file: server/Dockerfile
            name: castor
          - image: web
            context: web
            file: web/Dockerfile
            name: castor-web
          - image: agent
            context: agent
            file: agent/Dockerfile
            name: castor-agent
    steps:
      - uses: actions/checkout@v4
      - name: The tag's version is the code's
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/^version = "\(.*\)"/\1/p' server/pyproject.toml | head -1)
          [ "$have" = "$want" ] || { echo "::error::server/pyproject.toml is $have, the tag is $want"; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/emilyastranova/${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=edge,branch=main
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=Castor ${{ matrix.image }}: a Kanban board that runs automation
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: GitHub Release
    needs: [version, images]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          pre=""
          case "$version" in *-*) pre="--prerelease" ;; esac
          cat > notes.md <<NOTES
          Images on Docker Hub (linux/amd64 and linux/arm64):

          \`\`\`
          docker pull ${IMAGE_PREFIX}:${version}
          docker pull ${IMAGE_PREFIX}-web:${version}
          docker pull ${IMAGE_PREFIX}-agent:${version}
          \`\`\`

          With the repository's compose.yaml: \`CASTOR_VERSION=${version} docker compose pull && docker compose up -d\`.
          NOTES
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Castor $version" --notes-file notes.md --generate-notes $pre
