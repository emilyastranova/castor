<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- Installing Castor as an app (Chrome's "Install" / "Save as app", Edge, Android, iOS). -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="theme-color" content="#545a92" />
		<meta name="application-name" content="Castor" />
		<meta name="apple-mobile-web-app-title" content="Castor" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&family=Roboto+Mono:wght@400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=swap"
			rel="stylesheet"
		/>
		<!-- The instance's default theme (hooks.server.ts), for a browser that has never signed in. -->
		<script id="castor-default-theme" type="application/json">%castor.default_theme%</script>
		<script>
			// Apply the saved theme before first paint to avoid a flash.
			try {
				const root = document.documentElement;
				const t = localStorage.getItem('castor.theme');
				if (t === 'light' || t === 'dark') root.dataset.theme = t;
				// The chosen theme (docs/THEME_SPEC.md, lib/m3/theme.ts applyTheme): its compiled CSS,
				// its stylesheets, and what the theme colour does with it.
				// Nothing saved: this browser has never signed in, so it shows the instance default.
				const saved = localStorage.getItem('castor.skin');
				let skin = JSON.parse(saved || 'null');
				if (saved === null) {
					try {
						skin = JSON.parse(document.getElementById('castor-default-theme').textContent || 'null');
					} catch {}
				}
				if (skin && skin.id) {
					root.dataset.skin = skin.id;
					const style = document.createElement('style');
					style.id = 'castor-theme';
					style.textContent = skin.css || '';
					document.head.appendChild(style);
					for (const href of skin.stylesheets || []) {
						const link = document.createElement('link');
						link.rel = 'stylesheet';
						link.href = href;
						link.dataset.themeFont = href;
						document.head.appendChild(link);
					}
				}
				const modes = skin && skin.modes;
				const dark = modes === 'dark' || (modes !== 'light' && (t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches));
				const colour = (skin && skin.colour) || 'palette';
				const seed = localStorage.getItem('castor.seed');
				const vars = JSON.parse(localStorage.getItem('castor.seed.vars') || 'null');
				const accent = JSON.parse(localStorage.getItem('castor.seed.accent') || 'null');
				if (seed && colour === 'accent' && accent && accent.seed === seed && accent.v === 4) { // v: theme.ts ACCENT_VERSION
					root.dataset.seed = seed;
					for (const [name, value] of Object.entries(dark ? accent.dark : accent.light)) root.style.setProperty(name, value);
				} else if (seed && colour === 'palette' && vars && vars.seed === seed) {
					root.dataset.seed = seed;
					for (const [name, value] of Object.entries(dark ? vars.dark : vars.light)) root.style.setProperty(name, value);
				}
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
